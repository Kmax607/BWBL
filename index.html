<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BWBL Home</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="bwbl-2022.png">

    <style>

        body{
            font-family:Arial,sans-serif;
            margin:0;
            padding:0;
            background:#f0f0f0;
        }

        .big-t{
            font-size:2.5em;
            text-align:center;
            margin-top:50px;
            color:#333;
            letter-spacing:5px;
            font-weight:bold;
            text-shadow:2px 2px 2px rgba(255,6,4,100);
        }

        .subtitle{
            text-align:center;
            margin-top:8px;
            font-size:1.05em;
            letter-spacing:3px;
            font-style:italic;
            color:#666;
            text-shadow:1px 1px 1px rgba(255,255,255,.6);
        }

        .image-container{
            display:flex;
            justify-content:center;
            margin-top: 18px;
        }

        .image-container img{
            width:auto;
            max-width:85%;
            height:auto;
            border-radius:10px;
        }

        .logo-container{
            text-align:center;
            margin-top:25px;
        }

        .logo-container img{
            max-width:300px;
            height:auto;
        }

        nav ul li a img{
            width:3em;
            height:auto;
            vertical-align:middle;
            margin-right:5px;
        }

        /* ===========================
           TEAM LOGO TICKER
           =========================== */

        .logo-ticker{

            width:100%;
            overflow:hidden;
            padding:12px 0;
            margin: 0;

        }

        .logo-track{

            display:flex;
            align-items:center;
            width:max-content;

            animation:scrollTicker 38s linear infinite;

        }

        .logo-track.reverse{

            animation:scrollReverse 38s linear infinite;
        
        }
        
        @keyframes scrollReverse{
        
            from{
        
                transform:translateX(-50%);
        
            }
        
            to{
        
                transform:translateX(0);
        
            }
        
        }

        .logo-track img{

            width:68px;
            height:68px;

            border-radius:50%;

            object-fit:cover;

            margin:0 14px;

            background:#fff;

            border:3px solid white;

            box-shadow:
                0 4px 10px rgba(0,0,0,.18);

            flex-shrink:0;

            transition:.2s;

        }


        @keyframes scrollTicker{

            from{

                transform:translateX(0);

            }

            to{

                transform:translateX(-50%);

            }

        }

        @media(max-width:700px){

            .logo-track img{

                width:52px;
                height:52px;
                margin:0 10px;

            }

        }

        .top-ticker{
            margin-top:22px;
            margin-bottom:22px;
        }
        
        .bottom-ticker{
            margin-top:22px;
            margin-bottom:22px;
        }

    </style>

    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1009184751283570"
        crossorigin="anonymous"></script>

</head>

<body>

<script src="header.js"></script>

<br>

<div class="big-t">
    Backyard Wiffle Ball League
</div>

<div class="subtitle">
    Est. 2004
</div>

<br><br>
    
<div class="logo-ticker top-ticker">
    <div class="logo-track reverse" id="logoTrackTop"></div>
</div>

<div class="image-container">
    <img src="BWBL Player Collage.png" alt="BWBL Home">
</div>

<div class="logo-ticker bottom-ticker">
    <div class="logo-track" id="logoTrack"></div>
</div>

</div>

<br><br>

<div class="logo-container">
    <img src="bwbl-2022.png" alt="BWBL Logo">
</div>

<p>
    <br><br><br>
</p>

<div id="footer-container"></div>

<script>

    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-container').innerHTML = data;
        });

    function toggleMenu() {
        document.getElementById("dropdown-nav").classList.toggle("show");
    }

    // -----------------------------
    // TEAM LOGO TICKER
    // -----------------------------

    const logos = [

        "1776.png",
        "17762.png",
        "ballbusters.png",
        "basesloaded.png",
        "bde.png",
        "diamonddogs.png",
        "electriccityexpress.png",
        "falseidols.png",
        "fivelokos.png",
        "flyingsquirrels.png",
        "jenkinsowls.png",
        "kingsofthenorth.png",
        "moonshots.png",
        "phoenix.png",
        "roadkill.png",
        "scaredhitless.png",
        "snackshack.png",
        "the570.png",
        "venomvipers.png",
        "wolverines.png"

    ];

    // Shuffle logos every page load

    function shuffle(array){

        for(let i=array.length-1;i>0;i--){

            const j=Math.floor(Math.random()*(i+1));

            [array[i],array[j]]=[array[j],array[i]];

        }

        return array;

    }

    const topLogos = [...logos];
    const bottomLogos = [...logos];
    
    shuffle(topLogos);
    shuffle(bottomLogos);

    const bottomTrack = document.getElementById("logoTrack");
    const topTrack = document.getElementById("logoTrackTop");
    
    function fillTrack(track, list){

        [...list, ...list].forEach(file=>{
    
            const img = document.createElement("img");
    
            img.src = file;
    
            img.alt = "";
    
            img.loading = "lazy";
    
            track.appendChild(img);
    
        });
    
    }
    
    fillTrack(topTrack, topLogos);
    fillTrack(bottomTrack, bottomLogos);

</script>

<!-- GoatCounter Visitor Tracking -->
<script
    data-goatcounter="https://bwbl.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
</script>

</body>
</html>
