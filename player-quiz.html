const hittingStats=[

function parseCSV(text){

    const rows=text.trim().split(/\r?\n/);

    const headers=rows[0].split(",").map(h=>h.trim());

    const data=[];

    for(let i=1;i<rows.length;i++){

        if(!rows[i].trim()) continue;

        const values=[];
        let current="";
        let inside=false;

        for(const ch of rows[i]){

            if(ch=='"'){
                inside=!inside;
                continue;
            }

            if(ch=="," && !inside){
                values.push(current);
                current="";
            }else{
                current+=ch;
            }

        }

        values.push(current);

        const obj={};

        headers.forEach((h,index)=>{
            obj[h]=values[index] ? values[index].trim() : "";
        });

        data.push(obj);

    }

    return data;

}

async function loadLeaderboards(){

    // ---------- ALL-TIME TOP 5 ----------

    const { data: top5, error: topError } = await db
        .from("scores")
        .select("name, score")
        .order("score", { ascending: false })
        .order("created_at", { ascending: true })
        .limit(5);

    if(topError){

        document.getElementById("top5").innerHTML =
            "<span style='color:red'>Unable to load leaderboard.</span>";

    }else{

        const medals = ["🥇","🥈","🥉","4.","5."];

        if(top5.length === 0){

            document.getElementById("top5").innerHTML =
                "No scores yet.";

        }else{

            document.getElementById("top5").innerHTML =
                top5.map((p,i)=>
                    `<div style="display:flex;justify-content:space-between;max-width:320px;margin:8px auto;font-size:20px;">
                        <span>${medals[i]} ${p.name}</span>
                        <strong>${p.score}</strong>
                    </div>`
                ).join("");

        }

    }

    // ---------- WEEKLY CHAMPION ----------

    const now = new Date();

    // Convert to New York time
    const eastern = new Date(
        now.toLocaleString("en-US",{
            timeZone:"America/New_York"
        })
    );

    const start = new Date(eastern);

    const { count: totalPlays } = await db
    .from("scores")
    .select("*", { count: "exact", head: true });
    
    // Monday = 1
    const day = start.getDay();

    const diff = (day === 0 ? 6 : day - 1);

    start.setDate(start.getDate() - diff);

    start.setHours(0,1,0,0);

    // Convert back to UTC ISO string for Supabase
    const startISO = new Date(
        start.getTime() - eastern.getTimezoneOffset()*60000
    ).toISOString();

    const { data: weekly, error: weeklyError } = await db
        .from("scores")
        .select("name, score")
        .gte("created_at", startISO)
        .order("score",{ascending:false})
        .order("created_at",{ascending:true})
        .limit(1);

    if(weeklyError){

        document.getElementById("weeklyChampion").innerHTML =
            "<span style='color:red'>Unable to load weekly champion.</span>";

    }else if(weekly.length===0){

        document.getElementById("weeklyChampion").innerHTML =
            "<strong>No scores yet this week.</strong>";

    }else{

        const champ = weekly[0];

        const options = {
            month:"short",
            day:"numeric",
            year:"numeric",
            timeZone:"America/New_York"
        };

        document.getElementById("weeklyChampion").innerHTML = `
            <div style="display:flex;justify-content:space-between;max-width:320px;margin:8px auto;font-size:20px;">
                <span>🥇 ${champ.name}</span>
                <strong>${champ.score}</strong>
            </div>
        
            <div style="margin-top:12px;color:#666;font-size:14px;">
                Week of ${start.toLocaleDateString("en-US", options)}
            </div>
        
        `;

    }

}

async function loadData(){

    const hitText=await fetch(hittingURL,{cache:"no-store"}).then(r=>r.text());

    const pitchText=await fetch(pitchingURL,{cache:"no-store"}).then(r=>r.text());

    hitters=parseCSV(hitText);

    pitchers=parseCSV(pitchText);

    hitters=hitters.filter(p=>

        p.Name &&
        p.Name!="Totals" &&
        Number(p.GP)>=10

    );

    pitchers=pitchers.filter(p=>

        p.Name &&
        p.Name!="Totals" &&
        parseFloat(p.IP)>=20

    );

    nextQuestion();

}

function randomItem(arr){

    return arr[Math.floor(Math.random()*arr.length)];

}

function numeric(v){

    if(v===undefined) return NaN;

    return parseFloat(
        String(v)
            .replace("%","")
            .replace(",","")
            .trim()
    );

}

function getDifficulty(){

    // 5%, 10%, 15%, ...
    return Math.min(100, (score + 1) * 5);

}

function hitterMinimumGP(){

    // 80,75,70,65...
    return Math.max(0, 80 - (score * 5));

}

function pitcherMinimumIP(){

    // 90,85,80...
    return Math.max(0, 90 - (score * 5));

}

function updateDifficultyDisplay(){

    const difficulty = getDifficulty();

    let color;

    if(difficulty <= 10){
        color = "#8BC34A";          // Light Green
    }else if(difficulty <= 25){
        color = "#2E7D32";          // Dark Green
    }else if(difficulty <= 35){
        color = "#FBC02D";          // Yellow
    }else if(difficulty <= 50){
        color = "#FB8C00";          // Orange
    }else if(difficulty <= 60){
        color = "#D2691E";          // Burnt Orange
    }else if(difficulty <= 75){
        color = "#E53935";          // Light Red
    }else{
        color = "#8B0000";          // Dark Red
    }

    document.getElementById("subtitle").innerHTML =
        "Difficulty: <strong>" + difficulty + "%</strong>";

    document.getElementById("subtitle").style.color = color;

}

function choosePlayers(players, column, higher, isHitter){

    // Starts at 100% and gets 5% stricter each correct answer
    const maxDifference = Math.max(0.05, 1 - (score * 0.05));

    // Filter players based on current difficulty
    let eligible;

    if(isHitter){

        const minGP = Math.max(0, 80 - (score * 5));

        eligible = players.filter(p =>
            Number(p.GP) >= minGP
        );

    }else{

        const minIP = Math.max(0, 90 - (score * 5));

        eligible = players.filter(p =>
            parseFloat(p.IP) >= minIP
        );

    }

    // Safety fallback if too few eligible players
    if(eligible.length < 2){
        eligible = players;
    }

    let attempts = 0;

    while(attempts < 1000){

        attempts++;

        const a = randomItem(eligible);
        const b = randomItem(eligible);

        if(a.Name === b.Name) continue;

        const av = numeric(a[column]);
        const bv = numeric(b[column]);

        if(isNaN(av) || isNaN(bv)) continue;

        if(av === bv) continue;

        const diff = Math.abs(av - bv);
        const max = Math.max(Math.abs(av), Math.abs(bv));

        if(max === 0) continue;

        const pct = diff / max;

        if(pct > maxDifference) continue;

        return {
            a,
            b,
            av,
            bv
        };

    }

    // If we couldn't find a close enough matchup, just return any valid one
    while(true){

        const a = randomItem(eligible);
        const b = randomItem(eligible);

        if(a.Name === b.Name) continue;

        const av = numeric(a[column]);
        const bv = numeric(b[column]);

        if(isNaN(av) || isNaN(bv)) continue;

        if(av === bv) continue;

        return {
            a,
            b,
            av,
            bv
        };

    }

}

function nextQuestion(){

    document.getElementById("result").textContent="";
    document.getElementById("details").innerHTML="";

    document.getElementById("nextBtn").style.display="none";

    document.getElementById("restartBtn").style.display="none";

    const useHitters=Math.random()<0.5;

    const stat=randomItem(
        useHitters ? hittingStats : pitchingStats
    );

    const players = choosePlayers(
        useHitters ? hitters : pitchers,
        stat.column,
        stat.higher,
        useHitters
    );

    if(!players){

        nextQuestion();
        return;

    }

    currentQuestion={

        ...players,
        stat,
        useHitters

    };

    document.getElementById("questionType").textContent=
        useHitters ? "Hitting" : "Pitching";

    document.getElementById("question").textContent=
        "Who"+stat.label+"?";

    document.getElementById("player1Name").textContent=
        players.a.Name;

    document.getElementById("player2Name").textContent=
        players.b.Name;

    document.getElementById("player1").className="player";
    document.getElementById("player2").className="player";

}

async function submitScore(finalScore){

    if(finalScore <= 0) return;

    // ----- Check current Top 5 -----

    const { data: top5 } = await db
        .from("scores")
        .select("score")
        .order("score",{ascending:false})
        .order("created_at",{ascending:true})
        .limit(5);

    let qualifiesTop5 = false;

    if(top5.length < 5){

        qualifiesTop5 = true;

    }else if(finalScore > top5[top5.length-1].score){

        qualifiesTop5 = true;

    }

    // ----- Check Weekly Champion -----

    const now = new Date();

    const eastern = new Date(
        now.toLocaleString("en-US",{
            timeZone:"America/New_York"
        })
    );

    const monday = new Date(eastern);

    const day = monday.getDay();

    monday.setDate(
        monday.getDate()-(day===0?6:day-1)
    );

    monday.setHours(0,1,0,0);

    const startISO = new Date(
        monday.getTime()-eastern.getTimezoneOffset()*60000
    ).toISOString();

    const { data: weekly } = await db
        .from("scores")
        .select("score")
        .gte("created_at",startISO)
        .order("score",{ascending:false})
        .limit(1);

    let qualifiesWeekly =
        weekly.length===0 ||
        finalScore > weekly[0].score;

    // Nothing to do

    if(!qualifiesTop5 && !qualifiesWeekly)
        return;

    // ----- Player name -----

    let playerName =
        localStorage.getItem("bwblPlayerName");

    if(!playerName){

        playerName = prompt(
            "🏆 Congratulations!\n\nEnter your name for the leaderboard:"
        );

        if(!playerName) return;

        playerName = playerName.trim();

        if(playerName==="") return;

        localStorage.setItem(
            "bwblPlayerName",
            playerName
        );

    }

    // ----- Upload -----

    await db
        .from("scores")
        .insert({
            name:playerName,
            score:finalScore
        });

    // ----- Trim All-Time to Top 5 -----

    const { data: allScores } = await db
        .from("scores")
        .select("id,score")
        .order("score",{ascending:false})
        .order("created_at",{ascending:true});

    if(allScores.length>5){

        const remove =
            allScores.slice(5).map(s=>s.id);

        await db
            .from("scores")
            .delete()
            .in("id",remove);

    }

    loadLeaderboards();

}

function answer(choice){

    if(!currentQuestion) return;

    document.getElementById("player1").classList.add("disabled");
    document.getElementById("player2").classList.add("disabled");

    const better=currentQuestion.stat.higher
        ? (currentQuestion.av>currentQuestion.bv ? 1 : 2)
        : (currentQuestion.av<currentQuestion.bv ? 1 : 2);

    const correct=choice===better;

    const correctCard=document.getElementById(
        better===1 ? "player1" : "player2"
    );

    correctCard.classList.add("correct");

    if(!correct){

        const wrongCard=document.getElementById(
            choice===1 ? "player1" : "player2"
        );

        wrongCard.classList.add("wrong");

    }

    document.getElementById("details").innerHTML=

        "<strong>"+currentQuestion.a.Name+
        "</strong>: "+currentQuestion.a[currentQuestion.stat.column]+
        "<br><strong>"+currentQuestion.b.Name+
        "</strong>: "+currentQuestion.b[currentQuestion.stat.column];

    if(correct){

        score++;

        document.getElementById("score").textContent=score;

        document.getElementById("result").innerHTML=
            "<span class='green'>Correct!</span>";

        document.getElementById("nextBtn").style.display="block";

    }else{

        document.getElementById("result").innerHTML=
            "<span class='red'>Incorrect! Game Over.</span>";

        if(score>bestScore){

            bestScore=score;

            localStorage.setItem(
                "bwblBestScore",
                bestScore
            );

            document.getElementById("bestScore").textContent=
                bestScore;

        }

        submitScore(score);

        document.getElementById("restartBtn").style.display="block";

    }

}

document.getElementById("player1")
.addEventListener("click",()=>answer(1));

document.getElementById("player2")
.addEventListener("click",()=>answer(2));

.addEventListener("click",()=>{

    updateDifficultyDisplay();

    document.getElementById("player1")
        .classList.remove("disabled");

    document.getElementById("player2")
        .classList.remove("disabled");

    nextQuestion();

});

document.getElementById("restartBtn")

    score=0;

    updateDifficultyDisplay();

    document.getElementById("score").textContent=0;

    document.getElementById("player1")
        .classList.remove("disabled");

    document.getElementById("player2")
        .classList.remove("disabled");

    nextQuestion();

});

loadData();

updateDifficultyDisplay();

loadLeaderboards();

</script>
